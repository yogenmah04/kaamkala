<div class="min-h-screen bg-gray-50 flex flex-col font-sans pb-20 lg:pb-0">
  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <h1 class="text-xl sm:text-3xl font-bold tracking-tight">KaamKala Configurator</h1>
        <div class="flex bg-indigo-800 p-1 rounded-lg text-sm">
          <button (click)="setAppMode('desk')" [ngClass]="{'bg-white text-indigo-800 shadow': activeAppMode === 'desk', 'text-white hover:bg-indigo-700': activeAppMode !== 'desk'}" class="px-4 py-1.5 rounded-md font-semibold transition-colors">Desk Builder</button>
          <button (click)="setAppMode('bed')" [ngClass]="{'bg-white text-indigo-800 shadow': activeAppMode === 'bed', 'text-white hover:bg-indigo-700': activeAppMode !== 'bed'}" class="px-4 py-1.5 rounded-md font-semibold transition-colors">Bed Builder</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-4 sm:py-8">
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- Left Column: Configurator & Sidebar -->
      <div class="w-full lg:w-1/3 flex-col gap-6" [ngClass]="{'flex': activeMobileTab === 'config', 'hidden lg:flex': activeMobileTab !== 'config'}">
        <app-configurator *ngIf="activeAppMode === 'desk'"></app-configurator>
        <app-bed-configurator *ngIf="activeAppMode === 'bed'"></app-bed-configurator>
        
        <app-sidebar *ngIf="activeAppMode === 'desk'"></app-sidebar>
      </div>
      
      <!-- Right Column: Canvas Preview -->
      <div class="w-full lg:w-2/3" [ngClass]="{'block': activeMobileTab === 'preview', 'hidden lg:block': activeMobileTab !== 'preview'}">
        <div class="sticky top-8">
          <app-canvas *ngIf="activeAppMode === 'desk'"></app-canvas>
          <app-bed-canvas *ngIf="activeAppMode === 'bed'"></app-bed-canvas>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Mobile Bottom Navigation (Visible only on small screens) -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-50 flex border-t border-gray-200">
    <button (click)="setMobileTab('config')" [ngClass]="{'text-indigo-600 border-t-4 border-indigo-600 bg-indigo-50': activeMobileTab === 'config', 'text-gray-500 hover:bg-gray-50 border-t-4 border-transparent': activeMobileTab !== 'config'}" class="flex-1 py-3 text-center font-bold flex flex-col items-center justify-center transition-colors">
      <span class="text-2xl mb-1">🛠️</span>
      <span class="text-[10px] sm:text-xs uppercase tracking-wider font-extrabold">Configurator</span>
    </button>
    <button (click)="setMobileTab('preview')" [ngClass]="{'text-indigo-600 border-t-4 border-indigo-600 bg-indigo-50': activeMobileTab === 'preview', 'text-gray-500 hover:bg-gray-50 border-t-4 border-transparent': activeMobileTab !== 'preview'}" class="flex-1 py-3 text-center font-bold flex flex-col items-center justify-center transition-colors">
      <span class="text-2xl mb-1">👁️</span>
      <span class="text-[10px] sm:text-xs uppercase tracking-wider font-extrabold">3D Preview</span>
    </button>
  </nav>
</div>
